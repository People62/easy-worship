version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      electron:
        patterns: ['electron', 'electron-*', '@electron/*', '@electron-toolkit/*']
      build-and-lint:
        patterns:
          ['vite', 'vitest', '@vitejs/*', 'eslint*', '@eslint/*', 'typescript*', 'prettier', '@commitlint/*', 'globals']
      react:
        patterns: ['react', 'react-dom', '@types/react*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: ci
